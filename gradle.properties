org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Phase 4 (UAAL): properties unityLibrary/build.gradle expects to find
# as project properties, copied from Unity's own exported gradle.properties
# (vehicle-hud-unity/Builds/AndroidExport/gradle.properties). NOT copied:
# android.builtInKotlin=false — Unity sets this because unityLibrary has no
# Kotlin sources at all, but this app's own :app module now relies on
# AGP 9's built-in Kotlin support (the separate kotlin-android plugin was
# removed during the AGP 9 migration), so forcing it off here would break
# :app's own compilation.
unityStreamingAssets=
unity.installInBuildFolder=false
unity.androidSdkPath=/Applications/Unity/Hub/Editor/6000.5.9f1/PlaybackEngines/AndroidPlayer/SDK
unity.androidNdkPath=/Applications/Unity/Hub/Editor/6000.5.9f1/PlaybackEngines/AndroidPlayer/NDK
unity.androidNdkVersion=27.2.12479018

# Pins Gradle to Android Studio's bundled JBR (JDK 21) so the CLI and the
# IDE always use the exact same JVM — avoids needing a separate JDK 17
# install/registration just to satisfy this project's toolchain.
org.gradle.java.home=/Users/yosukesakurai/Applications/Android Studio.app/Contents/jbr/Contents/Home
